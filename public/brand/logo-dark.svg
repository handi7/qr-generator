<svg width="216" height="64" viewBox="0 0 216 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- lockup for dark backgrounds -->
  <defs>
    <linearGradient id="gq-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19C2A0"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gq-shine" x1="32" y1="0" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#gq-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#gq-shine)"/>

  <rect x="11.5" y="11.5" width="15" height="15" rx="5" stroke="white" stroke-width="3"/>
  <rect x="16.5" y="16.5" width="5" height="5" rx="1.5" fill="white"/>
  <rect x="37.5" y="11.5" width="15" height="15" rx="5" stroke="white" stroke-width="3"/>
  <rect x="42.5" y="16.5" width="5" height="5" rx="1.5" fill="white"/>
  <rect x="11.5" y="37.5" width="15" height="15" rx="5" stroke="white" stroke-width="3"/>
  <rect x="16.5" y="42.5" width="5" height="5" rx="1.5" fill="white"/>
  <rect x="37" y="37" width="6" height="6" rx="2" fill="white"/>
  <rect x="47" y="37" width="6" height="6" rx="2" fill="white" fill-opacity="0.7"/>
  <rect x="42" y="42" width="6" height="6" rx="2" fill="white"/>
  <rect x="37" y="47" width="6" height="6" rx="2" fill="white" fill-opacity="0.7"/>
  <rect x="47" y="47" width="6" height="6" rx="2" fill="white"/>

  <text x="80" y="30" fill="#F2F7F7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5" dominant-baseline="middle">GaweQR</text>
  <text x="80" y="50" fill="#90A5B3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" dominant-baseline="middle">Design and download instantly</text>
