name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Not `npm run lint`: that script runs `eslint --fix`, which would mutate
      # files in CI and let violations pass silently.
      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
